version: '3.8'

services:
  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telemed-backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=your-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/telemed
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - JWT_SECRET_KEY=jwt-secret-key-change-in-production
    depends_on:
      - db
      - redis
    networks:
      - telemed-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Vue Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telemed-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_APP_API_URL=http://backend:8000/api/v1
      - VITE_APP_JITSI_URL=https://meet.jitsi
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - telemed-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: telemed-db
    environment:
      - POSTGRES_DB=telemed
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - telemed-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: telemed-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - telemed-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy (Optional)
  # nginx:
  #   image: nginx:latest
  #   container_name: telemed-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - telemed-network

volumes:
  postgres_data:
  redis_data:

networks:
  telemed-network:
    driver: bridge
